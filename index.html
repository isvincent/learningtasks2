function bodyStage(i){switch(i){case 0:return `<p class="lead">${tx('情境：兩張校慶講座海報都很精美。左圖的人物影像與引言由 AI 生成，沒有揭露；右圖的抽象背景由 AI 生成，已清楚標示。你如何判斷？此為虛構案例。','Scenario: Two school event posters look polished. The left uses an AI-generated person and quotation without disclosure. The right labels its AI-generated abstract background. How would you judge them? This is fictional.')}</p>${scen()}${field('observe',tx('我注意到的線索與疑問','What I notice and wonder'),tx('哪一張可能讓讀者誤會？為什麼？','Which might mislead someone, and why?'))}<h3>${tx('課前立場','Initial position')}</h3>${choice('stance',[['all',tx('全部標示','Label all use')],['risk',tx('特定情況標示','Label certain uses')],['none',tx('不要求','No requirement')],['uncertain',tx('尚不確定','Unsure')]])}${field('firstReason',tx('我的理由與信心程度（0～5）','My reason and confidence (0–5)'),'')}`;
case 1:return `<p class="lead">${tx('「應不應標示」還不夠精確。請拆解適用對象、內容、位置、例外與責任，形成可以查證的問題。','“Should it be labeled?” is broad. Break it into who, what, where, exceptions, and responsibility.')}</p><div class="grid three">${[['誰負責？','Who is responsible?'],['哪些內容？','Which content?'],['標在哪裡？','Where to label?'],['例外情況？','Exceptions?'],['違反怎麼辦？','If a rule is broken?'],['如何查證？','How to verify?']].map((x,j)=>`<div class="card accent"><span class="badge">0${j+1}</span><strong> ${tx(...x)}</strong></div>`).join('')}</div>${field('question',tx('我的核心研究問題','My inquiry question'),tx('例：校園公告使用 AI 生成人物影像時，應由誰標示？','Example: Who should disclose an AI-generated person in a school notice?'))}${field('hypotheses',tx('兩個待驗證假設，並標註「事實／推論／價值」','Two hypotheses, labeled fact / inference / value'))}`;
case 2:return `<p class="lead">${tx('讀四種不同來源。先確認「誰說的、何時發布、適用範圍、不能證明什麼」，再找一項你自己的第一手資料。','Read four distinct sources. Check author, date, scope, and what the source cannot prove. Then find one primary source yourself.')}</p>${source(tx('🇹🇼 台灣特定網路廣告','🇹🇼 Taiwan: certain online ads'),tx('數位發展部說明：網路廣告揭露資訊包含使用深度偽造技術或 AI 生成之個人影像。','Taiwan’s digital ministry explains disclosure for deepfake or AI-generated images of persons in online advertising.'),tx('不可推成所有生成文字或學生作品都依法必須標示。','Do not extend this to all AI text or all student work.'),'https://moda.gov.tw/ADI/news/latest-news/12816')}${source(tx('🇪🇺 歐盟 AI Act 第 50 條','🇪🇺 EU AI Act Article 50'),tx('條文對生成內容的機器可讀標記，以及深偽等內容對人的揭露，設有不同義務。自 2026 年 8 月 2 日適用。','The article distinguishes machine-readable marking of generated content from disclosure of certain deepfakes. It applies from August 2, 2026.'),tx('分清系統提供者與使用者的責任，閱讀例外條款。','Distinguish provider and deployer duties, and check exceptions.'),'https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50')}${source(tx('🧩 C2PA 來源憑證','🧩 C2PA Content Credentials'),tx('來源憑證可記錄內容來源與編修歷程。','Content Credentials can record a media asset’s origin and edits.'),tx('憑證不保證內容陳述為真；沒有憑證也不能證明內容由 AI 生成。','A credential does not prove every claim true; its absence does not prove AI generation.'),'https://spec.c2pa.org/specifications/specifications/2.4/explainer/Explainer.html')}${source(tx('🎓 UNESCO 教育指引','🎓 UNESCO education guidance'),tx('指引討論學生資料保護、適齡使用與教育用途評估。','The guidance addresses student privacy, age-appropriate use, and educational validation.'),tx('這是指引，不是台灣法律的逐字規定。','This guidance is not a Taiwan legal requirement.'),'https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research?hub=253682')}<p class="hint">${tr('sourceDate')}</p>${field('evidence1',tx('證據卡 1：來源、日期、原文重點、適用範圍','Evidence card 1: source, date, key point, scope'))}${field('evidence2',tx('證據卡 2：來源、日期、原文重點、限制','Evidence card 2: source, date, key point, limit'))}${field('ownSource',tx('自己找到的第一手來源與連結','A primary source I found and its URL'))}<h3>${tx('小測驗：事實、推論或價值判斷？','Quick check: fact, inference, or value?')}</h3><div id="quiz"></div>`;
case 3:return `<p class="lead">${tx('選一張角色卡，試著站在他的處境說話。接著比較「全部標示」「依風險標示」「自願標示」的代價。','Choose a role and speak from that viewpoint. Compare universal, risk-based, and voluntary labeling.')}</p><div class="grid three">${[['student','👩‍🎓', '學生','Student','合理協助與成績公平','Fair support and assessment'],['teacher','🧑‍🏫','教師','Teacher','學習證據與執行負擔','Learning evidence and workload'],['creator','🎨','創作者','Creator','表達自由與署名','Expression and credit'],['editor','📰','新聞編輯','Editor','查證與公信力','Verification and trust'],['platform','📱','平台','Platform','標記遺失與執行成本','Lost marks and costs'],['victim','🛡️','遭冒用者','Impersonation victim','及時揭露與移除','Disclosure and removal']].map(x=>`<button class="card stake ${data.role===x[0]?'selected':''}" data-role="${x[0]}" aria-pressed="${data.role===x[0]}"><span style="font-size:2em">${x[1]}</span><strong>${tx(x[2],x[3])}</strong><small>${tx(x[4],x[5])}</small></button>`).join('')}</div>${field('roleSpeech',tx('60 秒角色陳述：我的訴求與一項來源證據','60-second statement: concern and one cited source'))}${field('counterView',tx('另一個角色最強的反對理由','The strongest objection from another role'))}<h3>${tx('你最重視哪些價值？','Which values matter most?')}</h3><div class="choice-row" id="values">${[['transparency','透明','Transparency'],['fairness','公平','Fairness'],['freedom','創作自由','Creative freedom'],['privacy','隱私','Privacy'],['feasibility','可執行性','Feasibility']].map(x=>`<label class="choice"><input type="checkbox" data-val="${x[0]}" ${((data.fields.values||'').split(',').includes(x[0]))?'checked':''}> ${tx(x[1],x[2])}</label>`).join('')}</div>${field('tradeoff',tx('你選的方案保護了誰？讓誰承擔成本？','Whom does your choice protect, and who bears the cost?'))}`;
case 4:return `<p class="lead">${tx('用「主張、證據、推理、反方、回應」完成論證。立場可以是條件式的，不必只回答贊成或反對。','Build a claim with evidence, reasoning, counterargument, and response. Your position may be conditional.')}</p>${field('claim',tx('主張：我建議什麼標示規則？','Claim: what labeling rule do I propose?'))}${field('proof',tx('兩項來源證據及連結','Two pieces of source evidence and URLs'))}${field('reasoning',tx('推理：證據為何支持我的主張？','Reasoning: how does the evidence support my claim?'))}${field('counter',tx('反方最強的觀點','Strongest counterargument'))}${field('reply',tx('我的回應及願意調整之處','My response and possible adjustment'))}`;
case 5:return `<p class="lead">${tx('製作可供班級討論的「校園 AI 內容標示指引」。請寫清楚必標情況、位置、責任、例外與修正方式。','Create a school AI content labeling guide for class review. Specify trigger, placement, responsibility, exceptions, and revision.')}</p><div class="note">${tx('請勿使用真實同學的肖像或聲音製作仿冒素材。作品展示前先檢查個資。','Do not imitate a real classmate’s face or voice. Check personal data before displaying work.')}</div>${field('policyScope',tx('必標情況與門檻','When labeling is required'))}${field('policyPlace',tx('由誰標？標在什麼位置？','Who labels it, and where?'))}${field('policyExample1',tx('標示範例句 1','Example label 1'),tx('例：本海報背景由 AI 生成，活動資訊經主辦單位核對。','Example: The background was AI-generated; organizers verified the event details.'),2)}${field('policyExample2',tx('標示範例句 2','Example label 2'),'',2)}${field('policyException',tx('例外、申訴與修正方式','Exceptions, appeals, and corrections'))}<button class="btn primary no-print" id="previewPolicy">${tx('產生指引預覽','Preview my guide')}</button><div class="output" id="policyOutput" aria-live="polite"></div>${field('peerFeedback',tx('同儕測試：哪裡清楚？哪裡容易誤解？','Peer test: what is clear or confusing?'))}`;
case 6:return `<p class="lead">${tx('回看一開始的答案。你的立場是否改變？若維持原立場，新的證據是否讓理由更精確？','Return to your first answer. Did your view change? If not, did evidence sharpen your reasons?')}</p><h3>${tx('我的課前立場','My first position')}</h3><div class="card accent">${position(data.stance)}</div><h3>${tx('我的課後立場','My final position')}</h3>${choice('after',[['all',tx('全部標示','Label all use')],['risk',tx('特定情況標示','Label certain uses')],['none',tx('不要求','No requirement')],['uncertain',tx('尚不確定','Unsure')]])}${field('reflection',tx('最有影響的證據、仍不確定之處與政策修訂理由','Most influential evidence, uncertainty, and why I revised my rule'))}${field('exit',tx('離堂票：我的規則最能保護誰？可能增加誰的負擔？','Exit ticket: whom does my rule protect, and whom might it burden?'),'',2)}<div class="note">${tx('完成後可匯出 JSON 學習紀錄，或列印並另存 PDF。','Export your work as JSON, or print and save as PDF.')}</div>`}}
function position(v){return ({all:tx('全部標示','Label all use'),risk:tx('特定情況標示','Label certain uses'),none:tx('不要求','No requirement'),uncertain:tx('尚不確定','Unsure')})[v]||tx('尚未作答','Not answered')}
const QUIZ=[['歐盟 AI Act 第 50 條自 2026 年 8 月 2 日適用。','EU AI Act Article 50 applies from August 2, 2026.','fact'],['這張沒有來源憑證的圖片一定由 AI 製作。','This image has no credential, so it must be AI-generated.','inference'],['校園仿冒人物的影像應清楚標示。','A school image impersonating someone ought to be disclosed.','value']];
function quiz(){const q=document.querySelector('#quiz');if(!q)return;q.innerHTML=QUIZ.map((x,i)=>`<div class="quiz-item"><p>${i+1}. ${tx(x[0],x[1])}</p><div class="choice-row">${[['fact',tx('事實','Fact')],['inference',tx('推論','Inference')],['value',tx('價值判斷','Value')]].map(y=>`<button class="choice ${data.quiz[i]===y[0]?'selected':''}" data-quiz="${i}" data-answer="${y[0]}" aria-pressed="${data.quiz[i]===y[0]}">${y[1]}</button>`).join('')}</div></div>`).join('')+`<button class="btn primary" id="checkQuiz">${tx('檢查答案','Check answers')}</button><div class="feedback" id="quizFeedback" aria-live="polite"></div>`}
function renderStudent(){const i=data.stage;document.querySelector('#studentView').innerHTML=`<article class="panel"><div class="stage-head"><div class="icon" aria-hidden="true">${ICONS[i]}</div><div><div class="eyebrow" style="color:var(--violet)">${tx('階段','Stage')} ${i+1} / 7</div><h2>${lang()?ENS[i]:STAGES[i]}</h2></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">${bodyStage(i)}<div class="step-buttons"><button class="btn" id="done" aria-pressed="${data.completed.includes(i)}">${data.completed.includes(i)?'✓ ':''}${tr('complete')}</button></div>${nav()}</article>`;quiz();document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{data.fields[el.dataset.field]=el.value;persist()}));document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{data[el.dataset.choice]=el.dataset.value;persist();beep();renderStudent()}));document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',()=>{data.role=el.dataset.role;persist();beep();renderStudent()}));document.querySelectorAll('[data-val]').forEach(el=>el.addEventListener('change',()=>{data.fields.values=[...document.querySelectorAll('[data-val]:checked')].map(x=>x.dataset.val).join(',');persist()}));document.querySelectorAll('[data-quiz]').forEach(el=>el.addEventListener('click',()=>{data.quiz[el.dataset.quiz]=el.dataset.answer;persist();beep();renderStudent()}));document.querySelector('#checkQuiz')?.addEventListener('click',()=>{const score=QUIZ.filter((x,i)=>data.quiz[i]===x[2]).length;const f=document.querySelector('#quizFeedback');f.className='feedback '+(score===3?'ok':'bad');f.textContent=`${tr('score')} ${score} ${tr('of')} 3. ${tx('第二題是「沒有憑證」推論成「一定是 AI」，證據不足。','In item 2, a missing credential does not justify certainty about AI generation.')}`;beep(score===3?'success':'tap')});document.querySelector('#prev').onclick=()=>go(i-1);document.querySelector('#next').onclick=()=>go(i+1);document.querySelector('#done').onclick=()=>{if(!data.completed.includes(i))data.completed.push(i);else data.completed=data.completed.filter(x=>x!==i);persist();beep('success');render()};document.querySelector('#previewPolicy')?.addEventListener('click',previewPolicy);updateProgress()}
function previewPolicy(){const f=data.fields;document.querySelector('#policyOutput').textContent=[tx('校園 AI 內容標示指引','School AI labeling guide'),`${tx('必標','Trigger')}：${f.policyScope||'…'}`,`${tx('責任與位置','Responsibility & location')}：${f.policyPlace||'…'}`,`${tx('範例 1','Example 1')}：${f.policyExample1||'…'}`,`${tx('範例 2','Example 2')}：${f.policyExample2||'…'}`,`${tx('例外與修正','Exceptions & revision')}：${f.policyException||'…'}`].join('\n')}
const TEACH=[['0–15','觀察現象','展示兩版虛構公告。先個別記錄判斷與信心，不急著講解。','課前立場、觀察線索','Show two fictional notices; collect an initial view before explaining.','Initial position and observations'],['15–35','提出問題','追問誰、何時、標什麼、如何查證；避免只問贊成或反對。','可探究問題與假設','Ask who, when, what, and how to verify.','Inquiry question and hypotheses'],['35–85','查找與檢驗證據','示範查機構、日期、適用範圍與限制。四組交叉核對。','三張證據卡','Model source, date, scope, and limitations; cross-check.','Three evidence cards'],['85–125','比較立場','角色公聽會：60 秒陳述、30 秒回應；比較三種方案。','角色矩陣與反方觀點','Hold a role hearing and compare three approaches.','Stakeholder matrix'],['125–150','形成主張','要求兩項來源與 CER，檢查證據和結論的連結。','CER 草稿','Require two sources and claim-evidence-reasoning.','CER draft'],['150–180','採取行動','檢查政策門檻、位置、責任與例外；安排同儕測試。','校園指引與標示句','Check scope, placement, responsibility, and exceptions.','School guide'],['180–200','反思修正','回看第一立場，要求具體修訂與離堂票。','修訂說明與反思','Revisit initial position and collect a revision.','Revision and reflection']];
function renderTeacher(){document.querySelector('#teacherView').innerHTML=`<div class="panel"><div class="stage-head"><div class="icon">🧭</div><div><h2>${tr('teacherIntro')}</h2><p>${tr('teacherText')}</p></div></div><div class="timeline" style="margin-top:20px">${[['第 1 節','Lesson 1','觀察・提問・查核示範','Observe · ask · model verification'],['第 2 節','Lesson 2','來源查核與交叉檢驗','Verify and cross-check'],['第 3 節','Lesson 3','角色公聽會與 CER','Role hearing and CER'],['第 4 節','Lesson 4','標示指引與反思','Labeling guide and reflection']].map(x=>`<div class="card"><strong>${tx(x[0],x[1])}</strong><p>${tx(x[2],x[3])}</p></div>`).join('')}</div><h3>${tx('課堂計時器','Classroom timer')}</h3><div class="meter"><input id="timerMinutes" type="range" min="1" max="20" value="1" aria-label="${tr('minutes')}"><span id="timerChoice">1 ${tr('minutes')}</span></div><div class="timer" id="timerReadout" aria-live="off">01:00</div><div class="choice-row"><button class="btn primary" id="timerStart">${tr('start')}</button><button class="btn" id="timerPause">${tr('pause')}</button><button class="btn" id="timerReset">${tr('reset')}</button></div></div><div class="panel"><h2>${tx('七階段教師引導卡','Seven teaching cards')}</h2>${TEACH.map((x,i)=>`<details class="source"><summary>${ICONS[i]} ${lang()?ENS[i]:STAGES[i]} <small>${x[0]} min</small></summary><div class="inside"><p><strong>${tx('教師引導','Teacher prompt')}：</strong>${tx(x[2],x[4])}</p><p><strong>${tx('可見學習成果','Observable work')}：</strong>${tx(x[3],x[5])}</p></div></details>`).join('')}<div class="note">${tx('評量五面向：證據查核、論證推理、多元觀點、方案可行性、反思修正，各 1～4 分。評分不以學生選擇哪個立場為準。','Assess source checks, reasoning, multiple perspectives, feasibility, and revision, each 1–4 points. Do not grade by the position chosen.')}</div></div>`;const range=document.querySelector('#timerMinutes'),out=document.querySelector('#timerChoice');range.oninput=()=>{out.textContent=range.value+' '+tr('minutes');if(!timerId){timerSeconds=Number(range.value)*60;timerDisplay()}};document.querySelector('#timerStart').onclick=()=>{if(timerId)return;beep();timerId=setInterval(()=>{timerSeconds--;timerDisplay();if(timerSeconds<=0){clearInterval(timerId);timerId=null;beep('success');toast(tx('時間到！','Time is up!'))}},1000)};document.querySelector('#timerPause').onclick=()=>{clearInterval(timerId);timerId=null};document.querySelector('#timerReset').onclick=()=>{clearInterval(timerId);timerId=null;timerSeconds=Number(range.value)*60;timerDisplay()};timerDisplay()}
function timerDisplay(){const n=document.querySelector('#timerReadout');if(n)n.textContent=String(Math.floor(Math.max(0,timerSeconds)/60)).padStart(2,'0')+':'+String(Math.max(0,timerSeconds)%60).padStart(2,'0')}
function updateProgress(){const pct=Math.round(data.completed.length/7*100);document.querySelector('#progressFill').style.width=pct+'%';document.querySelector('#progressText').textContent=pct+'%';document.querySelector('#progressTrack').setAttribute('aria-valuenow',pct);document.querySelector('#stageNav').innerHTML=STAGES.map((x,i)=>`<button class="${i===data.stage?'active':''} ${data.completed.includes(i)?'done':''}" data-stage="${i}" aria-current="${i===data.stage?'step':'false'}">${ICONS[i]} ${i+1} ${lang()?ENS[i]:x}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(x=>x.onclick=()=>go(Number(x.dataset.stage)))}
function go(i){if(i<0||i>6)return;data.stage=i;persist();beep();renderStudent();document.querySelector('#main').scrollIntoView({behavior:'smooth',block:'start'})}function render(){document.documentElement.lang=lang()?'en':'zh-Hant';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n));document.querySelector('#studentView').classList.toggle('hidden',mode!=='student');document.querySelector('#teacherView').classList.toggle('hidden',mode!=='teacher');document.querySelector('#studentTab').classList.toggle('primary',mode==='student');document.querySelector('#teacherTab').classList.toggle('primary',mode==='teacher');renderStudent();renderTeacher();fillSettings();applyPreferences()}
function fillSettings(){for(const [id,opts] of Object.entries({device:[['auto','auto'],['mobile','mobile'],['tablet','tablet'],['desktop','desktop']],orientation:[['auto','auto'],['portrait','portrait'],['landscape','landscape']],fontSize:[['small','small'],['standard','standard'],['large','large']],theme:[['system','system'],['light','light'],['dark','dark']]})){const el=document.querySelector('#'+id);el.innerHTML=opts.map(([v,k])=>`<option value="${v}">${tr(k)}</option>`).join('');el.value=pref[id]}document.querySelector('#language').value=pref.language;document.querySelector('#sound').checked=pref.sound;document.querySelector('#soundStatus').textContent=tr(pref.sound?'on':'off');document.querySelector('#fullscreen').textContent=tr(document.fullscreenElement?'exitFullscreen':'enterFullscreen')}
function applyPreferences(){document.body.classList.remove('device-mobile','device-tablet','device-desktop','orientation-portrait','orientation-landscape','dark');if(pref.device!=='auto')document.body.classList.add('device-'+pref.device);if(pref.orientation!=='auto')document.body.classList.add('orientation-'+pref.orientation);const dark=pref.theme==='dark'||pref.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;if(dark)document.body.classList.add('dark');document.documentElement.style.setProperty('--scale',({small:.9,standard:1,large:1.2})[pref.fontSize]);document.querySelector('#soundStatus').textContent=tr(pref.sound?'on':'off')}
document.querySelector('#studentTab').onclick=()=>{mode='student';beep();render()};document.querySelector('#teacherTab').onclick=()=>{mode='teacher';beep();render()};const overlay=document.querySelector('#settingsOverlay');function close(){overlay.classList.remove('open');document.querySelector('#settingsBtn').focus()}document.querySelector('#settingsBtn').onclick=()=>{overlay.classList.add('open');document.querySelector('#closeSettings').focus();beep()};document.querySelector('#closeSettings').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))close();if(e.key==='Tab'&&overlay.classList.contains('open')){const els=[...overlay.querySelectorAll('button,select,input')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
for(const id of ['device','orientation','language','fontSize','theme'])document.querySelector('#'+id).onchange=e=>{pref[id]=e.target.value;tp();beep();render()};document.querySelector('#sound').onchange=e=>{pref.sound=e.target.checked;tp();applyPreferences();beep()};document.querySelector('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();fillSettings()}catch{toast(tx('此瀏覽器不支援全螢幕或目前無法啟用。','Full screen is unavailable here.'))}};document.addEventListener('fullscreenchange',fillSettings);matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyPreferences);document.querySelector('#clearBtn').onclick=()=>{if(!confirm(tr('resetAsk')))return;data={stage:0,completed:[],fields:{},stance:'',after:'',role:'',quiz:{}};persist();render();toast(tr('cleared'));close()};document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({topic:'AI generated content labeling',exportedAt:new Date().toISOString(),stageNames:STAGES,record:data},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI內容標示_學習紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);beep('success');toast(tr('downloaded'))};document.querySelector('#printBtn').onclick=()=>window.print();render();
})();
</script></body></html>
